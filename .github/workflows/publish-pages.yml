name: Publish playable build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  BUILD_ARCHIVE_URL: "https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-51ec-820a-9d87-845b831059e4/raw?se=2026-08-16T04%3A05%3A06Z&sp=r&sv=2026-02-06&sr=b&scid=34fae3bc-2b05-52b1-bf21-59a3ce51691e&skoid=e32cbaad-a1eb-4299-9f16-1b364ab43781&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-15T22%3A37%3A03Z&ske=2026-08-16T22%3A37%3A03Z&sks=b&skv=2026-02-06&sig=A/IT55OgGJwmr30qpp%2BCe1j8Mlcqot/a8HMvVfyGBLI%3D"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download playable build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rota-site"
          curl --fail --location --retry 4 --retry-delay 2 "$BUILD_ARCHIVE_URL" -o "$RUNNER_TEMP/rota-build.zip"
          unzip -q "$RUNNER_TEMP/rota-build.zip" -d "$RUNNER_TEMP/rota-site"
          find "$RUNNER_TEMP/rota-site" -type f -name '*.map' -delete
          touch "$RUNNER_TEMP/rota-site/.nojekyll"
          cp "$RUNNER_TEMP/rota-site/index.html" "$RUNNER_TEMP/rota-site/404.html"
          test -s "$RUNNER_TEMP/rota-site/index.html"

      - name: Store the build in the gh-pages branch
        shell: bash
        run: |
          set -euo pipefail
          export SITE_DIR="$RUNNER_TEMP/rota-site"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf .
          cp -a "$SITE_DIR/." .
          git add -A
          git commit -m "deploy: publish Rules of the Abyss web build"
          git push --force origin gh-pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/rota-site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
