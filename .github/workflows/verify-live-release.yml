name: Verify live UX release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-live-release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Verify GitHub Pages serves the corrected build
        shell: bash
        run: |
          set -euo pipefail
          site="https://wfontesd.github.io/ROTAWeb-public"
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsSL -H 'Cache-Control: no-cache' "$site/?verify=${GITHUB_SHA}-${attempt}" -o /tmp/index.html \
              && grep -q 'assets/index-Bpie9gTO.js' /tmp/index.html \
              && grep -q 'assets/index-BhR6KEGJ.css' /tmp/index.html; then
              ready=1
              break
            fi
            sleep 4
          done
          test "$ready" -eq 1
          curl -fsSL -H 'Cache-Control: no-cache' "$site/BUILD_INFO.txt?verify=${GITHUB_SHA}" -o /tmp/build-info.txt
          grep -q 'source_commit=525c7d9af64fb311ab4a805a4207a95cf6fe50f0' /tmp/build-info.txt
          curl -fsSL -H 'Cache-Control: no-cache' "$site/sw.js?verify=${GITHUB_SHA}" -o /tmp/sw.js
          grep -q 'rota-v1.1.1' /tmp/sw.js
          cat /tmp/build-info.txt
